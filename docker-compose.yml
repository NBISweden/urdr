---

services:

  urdr:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend/:/app
      - ./urdr.env:/app/urdr.env
      - cache:/tmp/.cache
    container_name: urdr
    expose:
      - "8080"
    ports:
      - 8080:8080
    restart: always
    env_file:
      - ./urdr.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/swagger/"]
      interval: 10s
      timeout: 3s
      retries: 60  # 10s * 60 = 10 minutes

  node-urdr:
    container_name: node-urdr
    env_file:
      - ./urdr.env
    environment:
      - NODE_OPTIONS="--max-old-space-size=2048"
    depends_on:
      urdr:
        condition: service_healthy

    build:
      context: ./
      dockerfile: ./node/Dockerfile
    command: sh -c 'rm -rf /home/node/app/node_modules/* && npm run start'
    volumes:
      - ./frontend:/home/node/app/
      - exclude:/home/node/app/node_modules

  redmine-mock:
    profiles:
      - mock
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["go", "run", "./cmd/mock-redmine"]
    container_name: redmine-mock
    volumes:
      - ./backend/:/app
      - cache:/tmp/.cache
    expose:
      - "3000"
    ports:
      - 3000:3000

  screenshots:
    profiles:
      - screenshots
    # This version has to be the same as the one in e2e/package.json
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    container_name: urdr-screenshots
    # The frontend is built with PUBLIC_API_URL=http://localhost:4567,
    # so the browser must reach the stack on the host's localhost.
    network_mode: host
    working_dir: /work
    command: sh -c 'npm ci --no-audit --no-fund && npm run --silent screenshots'
    environment:
      - BASE_URL=http://localhost:4567
    volumes:
      - ./e2e:/work
      - e2e-node-modules:/work/node_modules

  nginx:
    image: nginx:1.25.1-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 4567:80
    depends_on:
      urdr:
        condition: service_healthy
      node-urdr:
        condition: service_started

volumes:
  exclude: null
  cache:
  e2e-node-modules:
