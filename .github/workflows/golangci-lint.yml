---
name: golangci-lint
on:
  pull_request:
    paths:
      - backend/**
permissions:
  contents: read
jobs:
  golangci:
    name: go-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m
