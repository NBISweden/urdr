version: 2
updates:
  - package-ecosystem: "npm"
    directory: "frontend/"
    schedule:
      interval: "monthly"
    groups:
      all-npm:
        patterns:
          - "*"
    # TypeScript 7 is the Go rewrite and drops the JS compiler API that
    # ts-loader depends on, breaking the frontend build. See issue #1309.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "gomod"
    directory: "backend"
    schedule:
      interval: "monthly"
    groups:
      all-go:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "backend"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "frontend"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "node"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "production"
    schedule:
      interval: "monthly"
